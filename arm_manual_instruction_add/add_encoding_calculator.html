<title>ADD bit po bicie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: one wide band mirroring the Arm doc encoding table, inputs under it, legend and results below */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #1b1f27;
  --muted: #5d6675;
  --line: #c9ced8;
  --fixed: #eceef2;
  --accent: #2563c9;
  --accent-soft: #e3ecfb;
  --warn: #b4361f;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1a1e26; --fg: #e6e9ef; --muted: #9aa3b2; --line: #3a414d;
    --fixed: #232831; --accent: #7aa7f0; --accent-soft: #1f2c44; --warn: #f08a72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --fg: #e6e9ef; --muted: #9aa3b2; --line: #3a414d;
  --fixed: #232831; --accent: #7aa7f0; --accent-soft: #1f2c44; --warn: #f08a72; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
main { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0; text-wrap: balance; }
.asm { font-family: var(--font-mono); font-size: 1.25rem; color: var(--accent); margin-top: 6px; }
.lead { color: var(--muted); margin: 6px 0 0; }

.scroll { overflow-x: auto; padding-bottom: 6px; }
.table {
  display: grid; grid-template-columns: repeat(32, minmax(38px, 1fr));
  min-width: 1220px; font-family: var(--font-mono);
}
.num { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 4px; font-variant-numeric: tabular-nums; }
.doc {
  border: 1px solid var(--line); border-right: none; background: var(--surface);
  text-align: center; padding: 6px 0; font-size: 14px; position: relative;
}
.doc.last { border-right: 1px solid var(--line); }
.doc .sub { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.cell { padding: 6px 2px 0; }
.cell input {
  width: 100%; box-sizing: border-box; height: 48px; text-align: center;
  font-family: var(--font-mono); font-size: 22px; font-weight: 600;
  border: 2px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg);
}
.cell.fixed input { background: var(--fixed); border-style: dashed; }
.cell input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cell input.missing { border-color: var(--warn); }
.label {
  font-family: var(--font-body); font-size: 12px; color: var(--muted); text-align: center;
  padding: 6px 2px 0; line-height: 1.3; border-top: 2px solid var(--line); margin: 8px 3px 0;
}
.label.active, .doc.active { color: var(--accent); }
.label.active { border-top-color: var(--accent); }

.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 24px; margin: 0; padding: 0; list-style: none; }
.legend li { display: flex; gap: 12px; align-items: baseline; padding: 6px 8px; border-radius: 6px; min-width: 0; }
.legend li.active { background: var(--accent-soft); }
.legend code { font-family: var(--font-mono); font-weight: 600; min-width: 64px; color: var(--accent); }
.legend span { color: var(--fg); line-height: 1.4; }

.actions { display: flex; gap: 12px; flex-wrap: wrap; }
button {
  font-family: var(--font-display); font-size: 1rem; font-weight: 500;
  padding: 12px 22px; border-radius: 8px; border: 2px solid var(--accent);
  background: var(--accent); color: var(--surface); cursor: pointer;
}
button.secondary { background: transparent; color: var(--accent); }
button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.msg { color: var(--warn); margin: 0; min-height: 1.4em; }

.out { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.out h2 { font-family: var(--font-display); font-size: 1rem; margin: 0; color: var(--muted); font-weight: 500; }
.bits { font-family: var(--font-mono); font-size: clamp(16px, 2.2vw, 26px); letter-spacing: 0.04em; word-break: break-all; }
.groups { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--font-mono); }
.groups div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.groups b { font-size: 20px; font-weight: 600; }
.groups small { font-size: 12px; color: var(--muted); }
.hex { font-family: var(--font-mono); font-size: clamp(32px, 6vw, 56px); font-weight: 600; color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .out { animation: in .25s ease-out; } }
@keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>

<main>
  <header>
    <h1>ADD (immediate): kodowanie bit po bicie</h1>
    <div class="asm">add w1, w1, #1</div>
    <p class="lead">Górny wiersz to tabelka z dokumentacji Arm. Wpisz 0 lub 1 do każdej z 32 kratek. Kratki przerywane to bity stałe.</p>
  </header>

  <div class="scroll"><div class="table" id="table"></div></div>

  <ul class="legend" id="legend"></ul>

  <div>
    <div class="actions">
      <button id="btnBin" type="button">Pokaż binarnie</button>
      <button id="btnHex" type="button" class="secondary">Konwertuj na hex</button>
    </div>
    <p class="msg" id="msg"></p>
  </div>

  <section class="out" id="outBin" hidden></section>
  <section class="out" id="outHex" hidden></section>
</main>

<script>
const GROUPS = [
  { sym: "sf",    hi: 31, lo: 31, short: "rozmiar",      desc: "rozmiar rejestru: 0 = w (32 bity), 1 = x (64 bity)" },
  { sym: "op",    hi: 30, lo: 30, fixed: "0", short: "dodaj / odejmij", desc: "0 = dodawanie, 1 = odejmowanie (dla ADD zawsze 0)" },
  { sym: "S",     hi: 29, lo: 29, fixed: "0", short: "flagi",  desc: "czy ustawić flagi NZCV (dla ADD zawsze 0)" },
  { sym: "",      hi: 28, lo: 23, fixed: "100010", short: "stałe bity", desc: "„to jest dodawanie/odejmowanie stałej”, przepisujemy bez zmian", legendSym: "100010" },
  { sym: "sh",    hi: 22, lo: 22, short: "przesunięcie", desc: "0 = stała bez zmian, 1 = stała × 4096 (LSL #12)" },
  { sym: "imm12", hi: 21, lo: 10, short: "ile dodać",    desc: "stała do dodania, 0–4095, zapisana na 12 bitach" },
  { sym: "Rn",    hi: 9,  lo: 5,  short: "skąd",         desc: "numer rejestru źródłowego (<Wn>), 5 bitów" },
  { sym: "Rd",    hi: 4,  lo: 0,  short: "dokąd",        desc: "numer rejestru docelowego (<Wd>), 5 bitów" },
];
const col = bit => 32 - bit; // bit 31 -> column 1
const table = document.getElementById("table");
const legend = document.getElementById("legend");
const inputs = []; // index 0 = bit 31
const groupOfBit = {};

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

// row 1: bit numbers
for (let b = 31; b >= 0; b--) table.appendChild(el("div", "num", b));

// row 2: doc row (symbol or fixed digit, like the Arm table)
GROUPS.forEach((g, gi) => {
  if (g.fixed && g.sym) {
    const d = el("div", "doc", `${g.fixed}<span class="sub">${g.sym}</span>`);
    d.style.gridColumn = `${col(g.hi)} / span 1`; d.dataset.g = gi; table.appendChild(d);
  } else if (g.fixed) {
    [...g.fixed].forEach((ch, i) => {
      const d = el("div", "doc", ch); d.style.gridColumn = `${col(g.hi) + i} / span 1`; d.dataset.g = gi; table.appendChild(d);
    });
  } else {
    const d = el("div", "doc" + (g.lo === 0 ? " last" : ""), g.sym);
    d.style.gridColumn = `${col(g.hi)} / span ${g.hi - g.lo + 1}`; d.dataset.g = gi; table.appendChild(d);
  }
});

// row 3: inputs
GROUPS.forEach((g, gi) => {
  for (let b = g.hi; b >= g.lo; b--) {
    groupOfBit[b] = gi;
    const c = el("div", "cell" + (g.fixed ? " fixed" : ""));
    c.style.gridColumn = `${col(b)} / span 1`;
    const inp = document.createElement("input");
    inp.id = "bit" + b; inp.inputMode = "numeric"; inp.autocomplete = "off"; inp.maxLength = 1;
    inp.setAttribute("aria-label", `bit ${b}${g.sym ? " (" + g.sym + ")" : ""}`);
    inp.dataset.idx = 31 - b;
    c.appendChild(inp); table.appendChild(c); inputs[31 - b] = inp;
  }
});

// row 4: short Polish labels
GROUPS.forEach((g, gi) => {
  const l = el("div", "label", g.short);
  l.style.gridColumn = `${col(g.hi)} / span ${g.hi - g.lo + 1}`; l.dataset.g = gi; table.appendChild(l);
});

// legend
GROUPS.forEach((g, gi) => {
  const li = el("li", null, `<code>${g.legendSym || g.sym}</code><span>${g.desc}</span>`);
  li.dataset.g = gi; legend.appendChild(li);
});

function highlight(gi) {
  document.querySelectorAll("[data-g]").forEach(e => e.classList.toggle("active", gi != null && e.dataset.g == gi));
}

inputs.forEach((inp, i) => {
  inp.addEventListener("focus", () => { highlight(groupOfBit[31 - i]); inp.select(); });
  inp.addEventListener("blur", () => highlight(null));
  inp.addEventListener("input", () => {
    const v = inp.value.replace(/[^01]/g, "").slice(-1);
    inp.value = v; inp.classList.remove("missing");
    if (v && i < 31) inputs[i + 1].focus();
  });
  inp.addEventListener("keydown", e => {
    if (e.key === "Backspace" && !inp.value && i > 0) { e.preventDefault(); inputs[i - 1].value = ""; inputs[i - 1].focus(); }
    else if (e.key === "ArrowLeft" && i > 0) { e.preventDefault(); inputs[i - 1].focus(); }
    else if (e.key === "ArrowRight" && i < 31) { e.preventDefault(); inputs[i + 1].focus(); }
  });
  inp.addEventListener("paste", e => {
    const t = (e.clipboardData.getData("text") || "").replace(/[^01]/g, "");
    if (!t) return;
    e.preventDefault();
    [...t].forEach((ch, k) => { if (inputs[i + k]) { inputs[i + k].value = ch; inputs[i + k].classList.remove("missing"); } });
    inputs[Math.min(i + t.length, 31)].focus();
  });
});

const msg = document.getElementById("msg");
const outBin = document.getElementById("outBin");
const outHex = document.getElementById("outHex");

function readBits() {
  const missing = inputs.filter(x => x.value === "");
  inputs.forEach(x => x.classList.toggle("missing", x.value === ""));
  if (missing.length) {
    msg.textContent = `Uzupełnij wszystkie kratki. Brakuje ${missing.length} z 32.`;
    outBin.hidden = outHex.hidden = true;
    return null;
  }
  msg.textContent = "";
  return inputs.map(x => x.value).join("");
}

document.getElementById("btnBin").addEventListener("click", () => {
  const bits = readBits(); if (!bits) return;
  const groups = GROUPS.map(g => `<div><b>${bits.slice(31 - g.hi, 32 - g.lo)}</b><small>${g.sym || "stałe"}</small></div>`).join("");
  outBin.innerHTML = `<h2>Binarnie, 32 bity</h2><div class="bits">${bits}</div><div class="groups">${groups}</div>`;
  outBin.hidden = false;
});

document.getElementById("btnHex").addEventListener("click", () => {
  const bits = readBits(); if (!bits) return;
  const nibbles = bits.match(/.{4}/g);
  const groups = nibbles.map(n => `<div><b>${n}</b><small>${parseInt(n, 2).toString(16).toUpperCase()}</small></div>`).join("");
  const hex = nibbles.map(n => parseInt(n, 2).toString(16)).join("");
  outHex.innerHTML = `<h2>Po 4 bity → jedna cyfra szesnastkowa</h2><div class="groups">${groups}</div><div class="hex">0x${hex}</div>`;
  outHex.hidden = false;
});
</script>
